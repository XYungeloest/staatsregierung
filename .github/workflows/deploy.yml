name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Zielumgebung
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      portal_site_url:
        description: Vollständige Staatsportal-URL für Canonical, Sitemap und robots.txt. Für staging erforderlich.
        required: false
        type: string
      law_site_url:
        description: Vollständige OstRecht-URL für Canonical, Sitemap und robots.txt. Für staging erforderlich.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Abhängigkeiten auf hohe Sicherheitsrisiken prüfen
        run: npm audit --audit-level=high

      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium firefox webkit

      - name: Normquellen strikt prüfen
        run: npm run norms:audit -- --strict --quiet

      - name: Inhalte, Typen und Unit-Tests prüfen
        run: |
          npm run content:check
          npm run check
          npm run editorial:check
          npm run test:unit
          npm run build

      - name: Links prüfen
        run: npm run test:links

      - name: SEO prüfen
        run: npm run test:seo

      - name: Accessibility prüfen
        run: npm run test:a11y

      - name: Layout- und Qualitätsprüfungen
        run: npm run test:quality

      - name: Browser-Smoke-Tests
        run: npm run test:browsers

  visual:
    runs-on: macos-26

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Abhängigkeiten auf hohe Sicherheitsrisiken prüfen
        run: npm audit --audit-level=high

      - name: Chromium installieren
        run: npx playwright install chromium

      - name: Visuelle Regressionen prüfen
        run: npm run test:visual

      - name: Abweichungsbilder sichern
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-diffs-${{ github.sha }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  deploy:
    needs:
      - quality
      - visual
    runs-on: ubuntu-latest

    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Abhängigkeiten auf hohe Sicherheitsrisiken prüfen
        run: npm audit --audit-level=high

      - name: Deployment-Metadaten ermitteln
        id: deployment_meta
        env:
          DEFAULT_PRODUCTION_SITE_URL: https://freistaat-ostdeutschland.de
          DEFAULT_PRODUCTION_LAW_SITE_URL: https://recht.freistaat-ostdeutschland.de
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_PORTAL_SITE_URL: ${{ github.event.inputs.portal_site_url }}
          INPUT_LAW_SITE_URL: ${{ github.event.inputs.law_site_url }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DEPLOY_ENV="$INPUT_ENVIRONMENT"
            PORTAL_SITE_URL="$INPUT_PORTAL_SITE_URL"
            LAW_SITE_URL="$INPUT_LAW_SITE_URL"
          else
            DEPLOY_ENV="production"
            PORTAL_SITE_URL="$DEFAULT_PRODUCTION_SITE_URL"
            LAW_SITE_URL="$DEFAULT_PRODUCTION_LAW_SITE_URL"
          fi

          if [ "$DEPLOY_ENV" = "staging" ] && { [ -z "$PORTAL_SITE_URL" ] || [ -z "$LAW_SITE_URL" ]; }; then
            echo "Für ein Staging-Deployment müssen portal_site_url und law_site_url gesetzt werden." >&2
            exit 1
          fi

          if [ -z "$PORTAL_SITE_URL" ]; then
            PORTAL_SITE_URL="$DEFAULT_PRODUCTION_SITE_URL"
          fi
          if [ -z "$LAW_SITE_URL" ]; then
            LAW_SITE_URL="$DEFAULT_PRODUCTION_LAW_SITE_URL"
          fi

          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "portal_site_url=$PORTAL_SITE_URL" >> "$GITHUB_OUTPUT"
          echo "law_site_url=$LAW_SITE_URL" >> "$GITHUB_OUTPUT"

      - name: Type-Check
        run: npm run check

      - name: Inhalte prüfen
        run: npm run content:check

      - name: Unit-Tests
        run: npm run test:unit

      - name: Build für Cloudflare erzeugen
        run: npm run build
        env:
          PORTAL_SITE_URL: ${{ steps.deployment_meta.outputs.portal_site_url }}
          LAW_SITE_URL: ${{ steps.deployment_meta.outputs.law_site_url }}
          PORTAL_BUILD_COMMIT: ${{ github.sha }}

      - name: Nach Cloudflare deployen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ steps.deployment_meta.outputs.deploy_env }}
        run: |
          if [ "$DEPLOY_ENV" = "staging" ]; then
            npm run deploy:staging
          else
            npm run deploy
          fi
