name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Zielumgebung
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      portal_site_url:
        description: Vollständige Staatsportal-URL für Canonical, Sitemap und robots.txt. Für staging erforderlich.
        required: false
        type: string
      law_site_url:
        description: Vollständige OstRecht-URL für Canonical, Sitemap und robots.txt. Für staging erforderlich.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      deploy_portal: ${{ steps.scope.outputs.deploy_portal }}
      deploy_law: ${{ steps.scope.outputs.deploy_law }}
      deploy_targets: ${{ steps.scope.outputs.deploy_targets }}
      run_ui_smoke: ${{ steps.scope.outputs.run_ui_smoke }}
      run_full_ui_smoke: ${{ steps.scope.outputs.run_full_ui_smoke }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Änderungsscope bestimmen
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            printf '.manual-deploy\n' | node scripts/classify-change-scope.mjs --stdin --github-output "$GITHUB_OUTPUT"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA" | node scripts/classify-change-scope.mjs --stdin --github-output "$GITHUB_OUTPUT"
          else
            git diff-tree --root --no-commit-id --name-only -r "$EVENT_SHA" | node scripts/classify-change-scope.mjs --stdin --github-output "$GITHUB_OUTPUT"
          fi

  build:
    needs: classify
    if: ${{ needs.classify.outputs.scope != 'docs-only' }}
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.deployment_meta.outputs.deploy_env }}
      portal_site_url: ${{ steps.deployment_meta.outputs.portal_site_url }}
      law_site_url: ${{ steps.deployment_meta.outputs.law_site_url }}
      deploy_targets: ${{ needs.classify.outputs.deploy_targets }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Abhängigkeiten auf hohe Sicherheitsrisiken prüfen
        run: npm audit --audit-level=high

      - name: Deployment-Metadaten ermitteln
        id: deployment_meta
        env:
          DEFAULT_PRODUCTION_SITE_URL: https://freistaat-ostdeutschland.de
          DEFAULT_PRODUCTION_LAW_SITE_URL: https://recht.freistaat-ostdeutschland.de
          EVENT_NAME: ${{ github.event_name }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_PORTAL_SITE_URL: ${{ github.event.inputs.portal_site_url }}
          INPUT_LAW_SITE_URL: ${{ github.event.inputs.law_site_url }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DEPLOY_ENV="$INPUT_ENVIRONMENT"
            PORTAL_SITE_URL="$INPUT_PORTAL_SITE_URL"
            LAW_SITE_URL="$INPUT_LAW_SITE_URL"
          else
            DEPLOY_ENV="production"
            PORTAL_SITE_URL="$DEFAULT_PRODUCTION_SITE_URL"
            LAW_SITE_URL="$DEFAULT_PRODUCTION_LAW_SITE_URL"
          fi

          if [ "$DEPLOY_ENV" = "staging" ] && { [ -z "$PORTAL_SITE_URL" ] || [ -z "$LAW_SITE_URL" ]; }; then
            echo "Für ein Staging-Deployment müssen portal_site_url und law_site_url gesetzt werden." >&2
            exit 1
          fi

          if [ -z "$PORTAL_SITE_URL" ]; then
            PORTAL_SITE_URL="$DEFAULT_PRODUCTION_SITE_URL"
          fi
          if [ -z "$LAW_SITE_URL" ]; then
            LAW_SITE_URL="$DEFAULT_PRODUCTION_LAW_SITE_URL"
          fi

          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "portal_site_url=$PORTAL_SITE_URL" >> "$GITHUB_OUTPUT"
          echo "law_site_url=$LAW_SITE_URL" >> "$GITHUB_OUTPUT"

      - name: Quellen, Inhalte, Typen und Unit-Tests prüfen
        env:
          DEPLOY_PORTAL: ${{ needs.classify.outputs.deploy_portal }}
          DEPLOY_LAW: ${{ needs.classify.outputs.deploy_law }}
        run: |
          npm run content:check
          if [ "$DEPLOY_PORTAL" = "true" ]; then
            npm run check:portal
          fi
          if [ "$DEPLOY_LAW" = "true" ]; then
            npm run check:recht
          fi
          npm run test:unit

      - name: Einmaligen Release-Build erzeugen
        env:
          DEPLOY_PORTAL: ${{ needs.classify.outputs.deploy_portal }}
          DEPLOY_LAW: ${{ needs.classify.outputs.deploy_law }}
          PORTAL_SITE_URL: ${{ steps.deployment_meta.outputs.portal_site_url }}
          LAW_SITE_URL: ${{ steps.deployment_meta.outputs.law_site_url }}
          PORTAL_BUILD_COMMIT: ${{ github.sha }}
        run: |
          if [ "$DEPLOY_PORTAL" = "true" ] && [ "$DEPLOY_LAW" = "true" ]; then
            npm run build
          elif [ "$DEPLOY_PORTAL" = "true" ]; then
            npm run build:portal
          else
            npm run build:recht
          fi

      - name: Deployment-Assets des Zielbuilds prüfen
        env:
          DEPLOY_TARGETS: ${{ needs.classify.outputs.deploy_targets }}
        run: npm run deploy:assets:check

      - name: Links und SEO im Release-Build prüfen
        env:
          SITE_TARGETS: ${{ needs.classify.outputs.deploy_targets }}
        run: |
          npm run test:links:run
          npm run test:seo:run

      - name: Geprüften Release-Build bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: site-build-${{ github.sha }}
          path: apps/*/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  accessibility_smoke:
    needs:
      - classify
      - build
    if: ${{ needs.classify.outputs.run_ui_smoke == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site-build-${{ github.sha }}
          path: apps
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Zentrale Seiten barrierefrei prüfen
        env:
          SITE_TARGETS: ${{ needs.classify.outputs.deploy_targets }}
        run: npm run test:a11y:ci

  browser_smoke:
    needs:
      - classify
      - build
    if: ${{ needs.classify.outputs.run_ui_smoke == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: site-build-${{ github.sha }}
          path: apps
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Zentrale Nutzerwege in Chromium prüfen
        env:
          SITE_TARGETS: ${{ needs.classify.outputs.deploy_targets }}
        run: npm run test:browsers:ci

  deploy:
    needs:
      - classify
      - build
      - accessibility_smoke
      - browser_smoke
    if: ${{ always() && needs.classify.outputs.scope != 'docs-only' && needs.build.result == 'success' && (needs.accessibility_smoke.result == 'success' || needs.accessibility_smoke.result == 'skipped') && (needs.browser_smoke.result == 'success' || needs.browser_smoke.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Geprüften Release-Build laden
        uses: actions/download-artifact@v8
        with:
          name: site-build-${{ github.sha }}
          path: apps
      - name: Nach Cloudflare deployen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ needs.build.outputs.deploy_env }}
          DEPLOY_TARGETS: ${{ needs.classify.outputs.deploy_targets }}
        run: |
          if [ "$DEPLOY_ENV" = "staging" ]; then
            if [ "$DEPLOY_TARGETS" = "law" ] || [ "$DEPLOY_TARGETS" = "portal,law" ]; then
              npm run deploy:recht:staging
            fi
            if [ "$DEPLOY_TARGETS" = "portal" ] || [ "$DEPLOY_TARGETS" = "portal,law" ]; then
              npm run deploy:portal:staging
            fi
          else
            if [ "$DEPLOY_TARGETS" = "law" ] || [ "$DEPLOY_TARGETS" = "portal,law" ]; then
              npm run deploy:recht
            fi
            if [ "$DEPLOY_TARGETS" = "portal" ] || [ "$DEPLOY_TARGETS" = "portal,law" ]; then
              npm run deploy:portal
            fi
          fi
      - name: Produktionsstand der tatsächlich veröffentlichten Ziele prüfen
        if: ${{ needs.build.outputs.deploy_env == 'production' }}
        env:
          PORTAL_SITE_URL: ${{ needs.build.outputs.portal_site_url }}
          LAW_SITE_URL: ${{ needs.build.outputs.law_site_url }}
          DEPLOY_TARGETS: ${{ needs.classify.outputs.deploy_targets }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run test:deployment:production
