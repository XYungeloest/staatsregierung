name: Deploy to Cloudflare Workers

# Release-Pfad von main. Die Prüfungen richten sich nach dem Änderungsscope
# (scripts/classify-change-scope.mjs, docs/DEPLOYMENT_RUNBOOK.md):
#
#   classify ─┬─ build ───────────────┬─ runtime_smoke ─┬─ deploy
#             └─ d1_seed (Vollbestand)┼─ d1_sync ───────┘
#             │                        (Cloudflare D1, inkrementell; bei geänderter Projektions-
#             │                         logik mit Äquivalenznachweis statt Vollprojektion)
#             └─ visual (breite Screenshot-Inventur, kein Gate)
#
# Der lokale D1-Seed des Vollbestands entsteht parallel zum Build (Job d1_seed) und nur,
# wenn die Änderung Laufzeit, Projektion oder den Bestand in größerem Umfang berührt;
# ein bereits vorhandener Seed mit demselben Fingerabdruck kommt aus dem Actions-Cache
# (Verifikation statt Projektion). Rein visuelle Änderungen laufen gegen das Fixture.

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      environment:
        description: Zielumgebung
        required: true
        default: staging
        type: choice
        options:
          - staging
          - production
      target:
        description: Zu veröffentlichende Website
        required: true
        default: both
        type: choice
        options:
          - portal
          - law
          - both
      portal_site_url:
        description: Vollständige Staatsportal-URL für Canonical, Sitemap und robots.txt. Für staging erforderlich.
        required: false
        type: string
      law_site_url:
        description: Vollständige OstRecht-URL für Canonical, Sitemap und robots.txt. Für staging erforderlich.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: cloudflare-workers
  cancel-in-progress: true

jobs:
  classify:
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      deploy_portal: ${{ steps.scope.outputs.deploy_portal }}
      deploy_law: ${{ steps.scope.outputs.deploy_law }}
      deploy_targets: ${{ steps.scope.outputs.deploy_targets }}
      check_portal: ${{ steps.scope.outputs.check_portal }}
      check_law: ${{ steps.scope.outputs.check_law }}
      build_targets: ${{ steps.scope.outputs.build_targets }}
      ui_targets: ${{ steps.scope.outputs.ui_targets }}
      run_content_check: ${{ steps.scope.outputs.run_content_check }}
      run_knowledge_check: ${{ steps.scope.outputs.run_knowledge_check }}
      run_unit_tests: ${{ steps.scope.outputs.run_unit_tests }}
      run_corpus_tests: ${{ steps.scope.outputs.run_corpus_tests }}
      run_d1_sync: ${{ steps.scope.outputs.run_d1_sync }}
      run_ui_smoke: ${{ steps.scope.outputs.run_ui_smoke }}
      run_full_corpus_smoke: ${{ steps.scope.outputs.run_full_corpus_smoke }}
      run_visual: ${{ steps.scope.outputs.run_visual }}
      playwright_version: ${{ steps.scope.outputs.playwright_version }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Node.js und Abhängigkeiten (Code-Abschluss der Projektion braucht esbuild)
        uses: ./.github/actions/setup-node-modules
      - name: Änderungsscope bestimmen
        id: scope
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
          INPUT_TARGET: ${{ github.event.inputs.target }}
        run: |
          CHANGED_PATHS="${RUNNER_TEMP}/changed-paths.txt"
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            node scripts/classify-change-scope.mjs --manual-target "$INPUT_TARGET" --github-output "$GITHUB_OUTPUT"
          elif [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git diff --name-only "$EVENT_BEFORE" "$EVENT_SHA" > "$CHANGED_PATHS"
            node scripts/classify-change-scope.mjs --stdin --github-output "$GITHUB_OUTPUT" < "$CHANGED_PATHS"
          else
            git diff-tree --root --no-commit-id --name-only -r "$EVENT_SHA" > "$CHANGED_PATHS"
            node scripts/classify-change-scope.mjs --stdin --github-output "$GITHUB_OUTPUT" < "$CHANGED_PATHS"
          fi
          echo "playwright_version=$(node -e 'console.log(require("./package-lock.json").packages["node_modules/@playwright/test"].version)')" >> "$GITHUB_OUTPUT"

          output_value() {
            grep "^$1=" "$GITHUB_OUTPUT" | tail -n 1 | cut -d '=' -f 2-
          }
          target_label() {
            case "$1" in
              portal) printf 'Staatsportal' ;;
              law) printf 'OstRecht' ;;
              portal,law) printf 'Staatsportal und OstRecht' ;;
              '') printf 'kein Ziel' ;;
            esac
          }
          deployment_label() {
            if [ -n "$1" ]; then target_label "$1"; else printf 'kein Produktionsdeployment'; fi
          }
          yes_no() {
            if [ "$1" = "true" ]; then printf 'ja'; else printf 'nein'; fi
          }
          corpus_label() {
            if [ "$1" = "true" ]; then printf 'Vollbestand (Seed aus dem Cache)'; else printf 'Fixture'; fi
          }

          DEPLOY_TARGETS="$(output_value deploy_targets)"
          BUILD_TARGETS="$(output_value build_targets)"
          UI_TARGETS="$(output_value ui_targets)"
          if [ -f "$CHANGED_PATHS" ]; then
            CHANGED_FILE_COUNT="$(grep -cve '^[[:space:]]*$' "$CHANGED_PATHS" || true)"
          else
            CHANGED_FILE_COUNT=0
          fi

          {
            echo '## Änderungswirkung'
            echo
            echo "- Geänderte Dateien: ${CHANGED_FILE_COUNT}"
            echo "- Deployment: $(deployment_label "$DEPLOY_TARGETS")"
            echo "- Astro-Build: $(target_label "$BUILD_TARGETS")"
            echo "- Portal-Prüfung: $(yes_no "$(output_value check_portal)")"
            echo "- OstRecht-Prüfung: $(yes_no "$(output_value check_law)")"
            echo "- Content-Prüfung: $(yes_no "$(output_value run_content_check)")"
            echo "- Unit-Tests (schnell): $(yes_no "$(output_value run_unit_tests)")"
            echo "- Korpus-Tests: $(yes_no "$(output_value run_corpus_tests)")"
            echo "- D1-Projektion (Cloudflare, OstRecht-Laufzeitdaten): $(yes_no "$(output_value run_d1_sync)")"
            echo "- UI-Smoke: $(target_label "$UI_TARGETS")"
            echo "- OstRecht-Smoke-Bestand: $(corpus_label "$(output_value run_full_corpus_smoke)")"
            echo "- Screenshot-Suite (breit): $(yes_no "$(output_value run_visual)")"
          } >> "$GITHUB_STEP_SUMMARY"

  docs_check:
    needs: classify
    if: ${{ needs.classify.outputs.scope == 'docs-only' }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Dokumentationsänderung auf Whitespace- und Patchfehler prüfen
        env:
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ]; then
            git diff --check "$EVENT_BEFORE" "$EVENT_SHA"
          else
            git diff-tree --root --check --no-commit-id -r "$EVENT_SHA"
          fi
      - name: Dokumentationsstruktur prüfen (kanonische Dokumente, Links, TODO)
        run: node scripts/check-docs.mjs

  build:
    needs: classify
    if: ${{ needs.classify.outputs.scope != 'docs-only' }}
    runs-on: ubuntu-latest
    outputs:
      deploy_env: ${{ steps.deployment_meta.outputs.deploy_env }}
      portal_site_url: ${{ steps.deployment_meta.outputs.portal_site_url }}
      law_site_url: ${{ steps.deployment_meta.outputs.law_site_url }}
      deploy_targets: ${{ needs.classify.outputs.deploy_targets }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Node.js und Abhängigkeiten
        uses: ./.github/actions/setup-node-modules

      - name: Abhängigkeiten auf hohe Sicherheitsrisiken prüfen (Registryfehler werden wiederholt, Befunde nicht)
        run: |
          START=$(date +%s)
          node scripts/npm-audit-retry.mjs --audit-level high
          echo "audit=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/timings.txt"

      - name: Deployment-Metadaten ermitteln
        id: deployment_meta
        if: ${{ needs.classify.outputs.build_targets != '' }}
        env:
          DEFAULT_PRODUCTION_SITE_URL: https://freistaat-ostdeutschland.de
          DEFAULT_PRODUCTION_LAW_SITE_URL: https://recht.freistaat-ostdeutschland.de
          EVENT_NAME: ${{ github.event_name }}
          BUILD_TARGETS: ${{ needs.classify.outputs.build_targets }}
          INPUT_ENVIRONMENT: ${{ github.event.inputs.environment }}
          INPUT_PORTAL_SITE_URL: ${{ github.event.inputs.portal_site_url }}
          INPUT_LAW_SITE_URL: ${{ github.event.inputs.law_site_url }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            DEPLOY_ENV="$INPUT_ENVIRONMENT"
            PORTAL_SITE_URL="$INPUT_PORTAL_SITE_URL"
            LAW_SITE_URL="$INPUT_LAW_SITE_URL"
          else
            DEPLOY_ENV="production"
            PORTAL_SITE_URL="$DEFAULT_PRODUCTION_SITE_URL"
            LAW_SITE_URL="$DEFAULT_PRODUCTION_LAW_SITE_URL"
          fi

          if [ "$DEPLOY_ENV" = "staging" ]; then
            case "$BUILD_TARGETS" in
              portal)
                if [ -z "$PORTAL_SITE_URL" ]; then
                  echo "Für ein Portal-Staging-Deployment muss portal_site_url gesetzt werden." >&2
                  exit 1
                fi
                ;;
              law)
                if [ -z "$LAW_SITE_URL" ]; then
                  echo "Für ein OstRecht-Staging-Deployment muss law_site_url gesetzt werden." >&2
                  exit 1
                fi
                ;;
              portal,law)
                if [ -z "$PORTAL_SITE_URL" ] || [ -z "$LAW_SITE_URL" ]; then
                  echo "Für ein gemeinsames Staging-Deployment müssen portal_site_url und law_site_url gesetzt werden." >&2
                  exit 1
                fi
                ;;
              *)
                echo "Unbekannte Build-Ziele: $BUILD_TARGETS" >&2
                exit 1
                ;;
            esac
          fi

          if [ -z "$PORTAL_SITE_URL" ]; then
            PORTAL_SITE_URL="$DEFAULT_PRODUCTION_SITE_URL"
          fi
          if [ -z "$LAW_SITE_URL" ]; then
            LAW_SITE_URL="$DEFAULT_PRODUCTION_LAW_SITE_URL"
          fi

          echo "deploy_env=$DEPLOY_ENV" >> "$GITHUB_OUTPUT"
          echo "portal_site_url=$PORTAL_SITE_URL" >> "$GITHUB_OUTPUT"
          echo "law_site_url=$LAW_SITE_URL" >> "$GITHUB_OUTPUT"

      - name: Quellen, Inhalte, Typen, Unit-Tests und Dokumentationsstruktur prüfen
        env:
          CHECK_PORTAL: ${{ needs.classify.outputs.check_portal }}
          CHECK_LAW: ${{ needs.classify.outputs.check_law }}
          RUN_CONTENT_CHECK: ${{ needs.classify.outputs.run_content_check }}
          RUN_KNOWLEDGE_CHECK: ${{ needs.classify.outputs.run_knowledge_check }}
          RUN_UNIT_TESTS: ${{ needs.classify.outputs.run_unit_tests }}
          RUN_CORPUS_TESTS: ${{ needs.classify.outputs.run_corpus_tests }}
        run: |
          START=$(date +%s)
          node scripts/check-docs.mjs
          if [ "$RUN_CONTENT_CHECK" = "true" ]; then
            npm run content:check
          fi
          if [ "$RUN_KNOWLEDGE_CHECK" = "true" ]; then
            npm run knowledge:build
            git diff --exit-code -- knowledge/generated
            npm run knowledge:check
          fi
          if [ "$CHECK_PORTAL" = "true" ]; then
            npm run check:portal
          fi
          if [ "$CHECK_LAW" = "true" ]; then
            npm run check:recht
          fi
          if [ "$RUN_UNIT_TESTS" = "true" ]; then
            npm run test:fast
          fi
          if [ "$RUN_CORPUS_TESTS" = "true" ]; then
            npm run test:corpus
          fi
          echo "checks=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/timings.txt"

      - name: Einmaligen Release-Build erzeugen
        if: ${{ needs.classify.outputs.build_targets != '' }}
        env:
          BUILD_TARGETS: ${{ needs.classify.outputs.build_targets }}
          PORTAL_SITE_URL: ${{ steps.deployment_meta.outputs.portal_site_url }}
          LAW_SITE_URL: ${{ steps.deployment_meta.outputs.law_site_url }}
          PORTAL_BUILD_COMMIT: ${{ github.sha }}
        run: |
          START=$(date +%s)
          case "$BUILD_TARGETS" in
            portal,law) npm run build ;;
            portal) npm run build:portal ;;
            law) npm run build:recht ;;
            *)
              echo "Unbekannte Build-Ziele: $BUILD_TARGETS" >&2
              exit 1
              ;;
          esac
          echo "build=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/timings.txt"

      - name: Deployment-Assets des Zielbuilds prüfen
        if: ${{ needs.classify.outputs.build_targets != '' }}
        env:
          DEPLOY_TARGETS: ${{ needs.classify.outputs.build_targets }}
        run: npm run deploy:assets:check

      - name: Links und SEO im Release-Build prüfen
        if: ${{ needs.classify.outputs.build_targets != '' }}
        env:
          SITE_TARGETS: ${{ needs.classify.outputs.build_targets }}
        run: |
          npm run test:links:run
          npm run test:seo:run

      - name: Geprüften Release-Build bereitstellen
        if: ${{ needs.classify.outputs.build_targets != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: site-build-${{ github.sha }}
          path: apps/*/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

      - name: Laufzeiten festhalten
        if: ${{ always() }}
        run: |
          {
            echo '### Laufzeiten build'
            echo
            echo '| Schritt | Sekunden |'
            echo '| --- | --- |'
            if [ -f "$RUNNER_TEMP/timings.txt" ]; then
              sed -E 's/^([^=]+)=(.*)$/| \1 | \2 |/' "$RUNNER_TEMP/timings.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -f "$RUNNER_TEMP/timings.txt" ] && echo "Laufzeiten: $(paste -sd ',' "$RUNNER_TEMP/timings.txt")" || true

  # Vollständiger lokaler D1-Seed des Rechtsbestands – parallel zum Build, nur wenn die Änderung
  # den Vollbestand-Smoke verlangt. Cache-Treffer: Snapshot wiederherstellen und verifizieren;
  # Cache-Miss: genau eine Projektion, danach Snapshot im Cache für spätere Läufe.
  d1_seed:
    needs: classify
    if: ${{ needs.classify.outputs.scope != 'docs-only' && needs.classify.outputs.run_full_corpus_smoke == 'true' && contains(needs.classify.outputs.ui_targets, 'law') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      status: ${{ steps.seed.outputs.status }}
      fingerprint: ${{ steps.seed.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
      - name: Node.js und Abhängigkeiten
        uses: ./.github/actions/setup-node-modules
      - name: Vollbestand-Seed bereitstellen (Cache oder einmalige Projektion)
        id: seed
        uses: ./.github/actions/d1-seed
        with:
          cache: 'true'

  # Release-Gate: Verifikation, Barrierefreiheits- und Browser-Smoke gegen den gebauten Worker.
  # Vollbestand (Seed aus d1_seed bzw. Cache) bei Laufzeit-/Projektionsänderungen, sonst Fixture.
  # Ein fehlender Cache-Eintrag führt hier zu einer Projektion als Rückfall, nie zu einem Abbruch.
  runtime_smoke:
    needs:
      - classify
      - build
      - d1_seed
    if: ${{ always() && needs.classify.outputs.run_ui_smoke == 'true' && needs.build.result == 'success' && (needs.d1_seed.result == 'success' || needs.d1_seed.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      # Leer = Vollbestand (Seed aus dem Cache); sonst das Testfixture. (Ein leerer String ist im
      # Ausdruck falsy, deshalb die Bedingung in dieser Reihenfolge.)
      OSTRECHT_D1_FIXTURE: ${{ needs.classify.outputs.run_full_corpus_smoke != 'true' && 'data/recht/runtime-fixture.json' || '' }}
    steps:
      - uses: actions/checkout@v7
      - name: Node.js und Abhängigkeiten
        uses: ./.github/actions/setup-node-modules
      - uses: actions/download-artifact@v8
        with:
          name: site-build-${{ github.sha }}
          path: apps
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: OstRecht-Worker mit lokaler D1-Projektion vorbereiten
        id: seed
        if: ${{ contains(needs.classify.outputs.ui_targets, 'law') }}
        uses: ./.github/actions/d1-seed
        with:
          fixture: ${{ env.OSTRECHT_D1_FIXTURE }}
          cache: ${{ needs.classify.outputs.run_full_corpus_smoke == 'true' && 'true' || 'false' }}
      - name: Lokale D1-Projektion gegen den Git-Bestand verifizieren
        if: ${{ contains(needs.classify.outputs.ui_targets, 'law') }}
        run: |
          START=$(date +%s)
          if [ -n "$OSTRECHT_D1_FIXTURE" ]; then
            npm run norms:runtime:d1-verify -- --local --fts-integrity --corpus-filter "$OSTRECHT_D1_FIXTURE"
          else
            npm run norms:runtime:d1-verify -- --local --fts-integrity
          fi
          echo "verify=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/timings.txt"
      - name: Zentrale Seiten barrierefrei prüfen
        env:
          SITE_TARGETS: ${{ needs.classify.outputs.ui_targets }}
        run: |
          START=$(date +%s)
          npm run test:a11y:ci
          echo "a11y=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/timings.txt"
      - name: Zentrale Nutzerwege in Chromium prüfen
        env:
          SITE_TARGETS: ${{ needs.classify.outputs.ui_targets }}
        run: |
          START=$(date +%s)
          npm run test:browsers:ci
          echo "browser=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/timings.txt"
      - name: Laufzeiten festhalten
        if: ${{ always() }}
        env:
          SEED_STATUS: ${{ steps.seed.outputs.status }}
          SEED_BUILD: ${{ steps.seed.outputs.build-seconds }}
          SEED_VERIFY: ${{ steps.seed.outputs.verify-seconds }}
          SEED_INSTALL: ${{ steps.seed.outputs.install-seconds }}
          CORPUS: ${{ needs.classify.outputs.run_full_corpus_smoke == 'true' && 'Vollbestand' || 'Fixture' }}
        run: |
          {
            echo "### Laufzeiten runtime_smoke (${CORPUS})"
            echo
            echo '| Schritt | Wert |'
            echo '| --- | --- |'
            echo "| Seed | ${SEED_STATUS:-übersprungen} (Projektion ${SEED_BUILD:-0} s, Verifikation ${SEED_VERIFY:-0} s, Einsetzen ${SEED_INSTALL:-0} s) |"
            if [ -f "$RUNNER_TEMP/timings.txt" ]; then
              sed -E 's/^([^=]+)=(.*)$/| \1 | \2 s |/' "$RUNNER_TEMP/timings.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Laufzeiten: seed=${SEED_STATUS:-übersprungen}/${SEED_BUILD:-0}s $( [ -f "$RUNNER_TEMP/timings.txt" ] && paste -sd ',' "$RUNNER_TEMP/timings.txt" )"

  # Breite Screenshot-Inventur (visual-extended) bei Oberflächenänderungen im festen Playwright-
  # Container, strikt gegen die committeten Linux-Baselines (Fixture-Bestand). Kein Deployment-
  # Gate; Baselines entstehen nur bewusst (npm run test:visual:update:linux oder Workflow
  # „Screenshot-Baselines erneuern“).
  visual:
    needs:
      - classify
      - build
    if: ${{ needs.classify.outputs.run_visual == 'true' && needs.classify.outputs.build_targets != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.classify.outputs.playwright_version }}-noble
    env:
      OSTRECHT_D1_FIXTURE: data/recht/runtime-fixture.json
      HOME: /root
    steps:
      - name: Git im Container sicherstellen (Seed-Fingerabdruck liest Git-Blob-Kennungen)
        run: command -v git >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends git)
      - uses: actions/checkout@v7
      - name: Arbeitsbaum für Git im Container freigeben (Checkout gehört einem anderen Benutzer)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Abhängigkeiten (Node.js des Containers)
        uses: ./.github/actions/setup-node-modules
        with:
          node-version: ''
      - uses: actions/download-artifact@v8
        with:
          name: site-build-${{ github.sha }}
          path: apps
      - name: OstRecht-Worker mit dem Testfixture vorbereiten
        if: ${{ contains(needs.classify.outputs.build_targets, 'law') }}
        uses: ./.github/actions/d1-seed
        with:
          fixture: data/recht/runtime-fixture.json
          cache: 'false'
      - name: Breite Screenshot-Suite strikt gegen die committeten Linux-Baselines prüfen
        env:
          SITE_TARGETS: ${{ needs.classify.outputs.build_targets }}
        run: |
          # Kein Bootstrap: fehlende Baselines sind ein Fehler. Neue oder geänderte Linux-Baselines
          # entstehen nur bewusst (npm run test:visual:update:linux oder Workflow „Screenshot-
          # Baselines erneuern“), nach Sichtprüfung und Commit.
          if ! ls tests/visual.spec.ts-snapshots/*-linux.png >/dev/null 2>&1; then
            echo "::error::Keine Linux-Screenshot-Baselines im Repository (tests/visual.spec.ts-snapshots/*-linux.png). Baselines mit npm run test:visual:update:linux oder dem Workflow „Screenshot-Baselines erneuern“ erzeugen, sichten und committen."
            exit 1
          fi
          npm run test:visual:extended
      - name: Testbericht bereitstellen
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-report-${{ github.sha }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  # OstRecht liest Normen, Fassungen, Verkündungen und den Suchindex zur Laufzeit
  # aus Cloudflare D1. Änderungen an content/normen und content/verkuendungen
  # brauchen deshalb kein OstRecht-Deployment, sondern eine neue Projektion.
  # Schema-Migrationen (data/recht/d1/*.sql) werden bewusst manuell eingespielt,
  # siehe docs/REVOSAX_BULK_IMPORT.md. Verlangt der Lauf eine Vollprojektion nur wegen
  # geänderter Projektionslogik, entscheidet der Äquivalenznachweis (Basis- gegen Ziel-
  # projektion, vollständiger Tabellenvergleich): nachgewiesen gleiche Daten übernehmen nur die
  # neue Identität, ein nachgewiesener inkrementeller Umfang wird geschrieben; sonst bleibt der
  # Lauf fail-closed rot (der PR-Check d1_token_check hat das vorher gezeigt).
  d1_sync:
    needs:
      - classify
      - build
      - d1_seed
    if: ${{ always() && github.event_name == 'push' && needs.classify.outputs.run_d1_sync == 'true' && needs.build.result == 'success' && (needs.d1_seed.result == 'success' || needs.d1_seed.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Node.js und Abhängigkeiten
        uses: ./.github/actions/setup-node-modules
      - name: Basis-Commit und Entscheidung des Syncs bestimmen (Remote-State, kein Schreibzugriff)
        id: remote_state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          EVENT_BEFORE: ${{ github.event.before }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          if [ -n "$EVENT_BEFORE" ] && [ "$EVENT_BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$EVENT_BEFORE^{commit}" 2>/dev/null; then
            echo "base=$EVENT_BEFORE" >> "$GITHUB_OUTPUT"
            set +e
            npm run norms:runtime:d1-sync -- --transport api --remote-state --git-diff "$EVENT_BEFORE" "$EVENT_SHA" --budget incremental
            RC=$?
            set -e
            echo "rc=$RC" >> "$GITHUB_OUTPUT"
            if [ "$RC" != "0" ] && [ "$RC" != "3" ]; then exit "$RC"; fi
          else
            echo "base=" >> "$GITHUB_OUTPUT"
            echo "rc=0" >> "$GITHUB_OUTPUT"
          fi
      - name: Seed-Schlüssel der Basis bestimmen (Äquivalenznachweis)
        if: ${{ steps.remote_state.outputs.rc == '3' }}
        id: base_seed
        env:
          BASE_SHA: ${{ steps.remote_state.outputs.base }}
        run: |
          node --experimental-strip-types scripts/d1-runtime-seed.mjs fingerprint --json --ref "$BASE_SHA" > "$RUNNER_TEMP/base-seed.json"
          node -e '
            const seed = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `key=d1-seed-${seed.fingerprint}\nsnapshot=${seed.snapshot}\n`);
          ' "$RUNNER_TEMP/base-seed.json"
      - name: Basis-Seed aus dem Cache
        if: ${{ steps.remote_state.outputs.rc == '3' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.base_seed.outputs.snapshot }}
            ${{ steps.base_seed.outputs.snapshot }}.json
          key: ${{ steps.base_seed.outputs.key }}
      - name: Ziel-Seed bereitstellen (Cache aus d1_seed oder einmalige Projektion)
        if: ${{ steps.remote_state.outputs.rc == '3' }}
        uses: ./.github/actions/d1-seed
        with:
          cache: 'true'
      - name: Äquivalenznachweis rechnen (Basis- gegen Zielprojektion, vollständiger Tabellenvergleich)
        if: ${{ steps.remote_state.outputs.rc == '3' }}
        id: proof
        env:
          BASE_SHA: ${{ steps.remote_state.outputs.base }}
          EVENT_SHA: ${{ github.sha }}
        run: |
          START=$(date +%s)
          npm run norms:runtime:d1-prove -- --base "$BASE_SHA" --head "$EVENT_SHA" --out "$RUNNER_TEMP/d1-equivalence" || true
          PROOF="$(ls "$RUNNER_TEMP"/d1-equivalence/proof-*.json | head -n 1)"
          echo "path=$PROOF" >> "$GITHUB_OUTPUT"
          {
            echo '### Äquivalenznachweis'
            echo
            echo "- Ergebnis: $(node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(`${p.result}${p.logicChange ? ` (${p.logicChange})` : ""}; abweichende Tabellen: ${(p.comparison && p.comparison.differingTables || []).join(", ") || "keine"}`)' "$PROOF")"
            echo "- Dauer: $(( $(date +%s) - START )) s"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Rechtsdaten inkrementell nach Cloudflare D1 projizieren
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASE_SHA: ${{ steps.remote_state.outputs.base }}
          EVENT_SHA: ${{ github.sha }}
          PROOF: ${{ steps.proof.outputs.path }}
        run: |
          # Nur die im Push geänderten Normen und Verkündungen; bei geänderter Projektionslogik der
          # nachgewiesene Umfang (--equivalence-proof), wenn kein Vorgängerstand bekannt ist eine
          # Vollprojektion, und – als markierte Recovery (--recover) – eine Vollprojektion, wenn D1
          # nicht den Ausgangszustand des Vorgänger-Commits trägt (Base-State-Guard). Budgets aus
          # data/recht/d1-sync-budgets.json: Vorabschätzung vor dem ersten Schreibzugriff
          # (0 Schreibzugriffe bei Überschreitung) und Abbruch bei realer Überschreitung;
          # bei unverändertem Stand (identischer Fingerabdruck und Scope) ist der Lauf ein No-op.
          if [ -n "$BASE_SHA" ]; then
            if [ -n "$PROOF" ]; then
              npm run norms:runtime:d1-sync -- --transport api --git-diff "$BASE_SHA" "$EVENT_SHA" --budget incremental --recover --equivalence-proof "$PROOF"
            else
              npm run norms:runtime:d1-sync -- --transport api --git-diff "$BASE_SHA" "$EVENT_SHA" --budget incremental --recover
            fi
          else
            npm run norms:runtime:d1-sync -- --transport api --full --budget full
          fi

  deploy:
    needs:
      - classify
      - build
      - runtime_smoke
      - d1_sync
    if: ${{ always() && needs.classify.outputs.deploy_targets != '' && needs.build.result == 'success' && (needs.runtime_smoke.result == 'success' || needs.runtime_smoke.result == 'skipped') && (needs.d1_sync.result == 'success' || needs.d1_sync.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Node.js und Abhängigkeiten
        uses: ./.github/actions/setup-node-modules
      - name: Geprüften Release-Build laden
        uses: actions/download-artifact@v8
        with:
          name: site-build-${{ github.sha }}
          path: apps
      - name: Nach Cloudflare deployen
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DEPLOY_ENV: ${{ needs.build.outputs.deploy_env }}
          DEPLOY_TARGETS: ${{ needs.classify.outputs.deploy_targets }}
        run: |
          if [ "$DEPLOY_ENV" = "staging" ]; then
            if [ "$DEPLOY_TARGETS" = "law" ] || [ "$DEPLOY_TARGETS" = "portal,law" ]; then
              npm run deploy:recht:staging
            fi
            if [ "$DEPLOY_TARGETS" = "portal" ] || [ "$DEPLOY_TARGETS" = "portal,law" ]; then
              npm run deploy:portal:staging
            fi
          else
            if [ "$DEPLOY_TARGETS" = "law" ] || [ "$DEPLOY_TARGETS" = "portal,law" ]; then
              npm run deploy:recht
            fi
            if [ "$DEPLOY_TARGETS" = "portal" ] || [ "$DEPLOY_TARGETS" = "portal,law" ]; then
              npm run deploy:portal
            fi
          fi
      - name: Produktionsstand der tatsächlich veröffentlichten Ziele prüfen
        if: ${{ needs.build.outputs.deploy_env == 'production' }}
        env:
          PORTAL_SITE_URL: ${{ needs.build.outputs.portal_site_url }}
          LAW_SITE_URL: ${{ needs.build.outputs.law_site_url }}
          DEPLOY_TARGETS: ${{ needs.classify.outputs.deploy_targets }}
          EXPECTED_COMMIT: ${{ github.sha }}
        run: npm run test:deployment:production
