name: OstRecht-Vollbestand-Smoke

# Verifikation, Browser- und Barrierefreiheits-Smoke gegen den gebauten OstRecht-Worker mit der
# vollständigen lokalen D1-Projektion (alle Normen), unabhängig vom Änderungsscope: manuell
# (workflow_dispatch) und wöchentlich. Der Seed kommt aus dem Actions-Cache (Fingerabdruck aus
# Projektionslogik, Bestand, Stichtag, Seed-Werkzeugen und Wrangler-Version); nur ohne passenden
# Eintrag wird projiziert. `refresh_seed` erzwingt die Projektion und beweist damit den
# Cache-Miss-Pfad. Es wird keine Cloudflare-Datenbank berührt.

on:
  workflow_dispatch:
    inputs:
      refresh_seed:
        description: Seed neu projizieren statt aus dem Cache (Nachweis des Cache-Miss-Pfads)
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '30 3 * * 1'

concurrency:
  group: full-corpus-smoke
  cancel-in-progress: true

jobs:
  full_corpus_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Node.js und Abhängigkeiten
        uses: ./.github/actions/setup-node-modules
      - name: OstRecht bauen
        run: |
          START=$(date +%s)
          npm run build:recht
          echo "build=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/timings.txt"
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Vollständige lokale D1-Projektion bereitstellen (Cache oder Projektion)
        id: seed
        uses: ./.github/actions/d1-seed
        with:
          cache: 'true'
          force: ${{ inputs.refresh_seed == true && 'true' || 'false' }}
      - name: Lokale D1-Projektion gegen den Git-Bestand verifizieren
        run: |
          START=$(date +%s)
          npm run norms:runtime:d1-verify -- --local --fts-integrity
          echo "verify=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/timings.txt"
      - name: Zentrale Seiten barrierefrei prüfen
        env:
          SITE_TARGETS: law
        run: |
          START=$(date +%s)
          npm run test:a11y:ci
          echo "a11y=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/timings.txt"
      - name: Zentrale Nutzerwege in Chromium prüfen
        env:
          SITE_TARGETS: law
        run: |
          START=$(date +%s)
          npm run test:browsers:ci
          echo "browser=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/timings.txt"
      - name: Laufzeiten festhalten
        if: ${{ always() }}
        env:
          SEED_STATUS: ${{ steps.seed.outputs.status }}
          SEED_BUILD: ${{ steps.seed.outputs.build-seconds }}
          SEED_VERIFY: ${{ steps.seed.outputs.verify-seconds }}
          SEED_INSTALL: ${{ steps.seed.outputs.install-seconds }}
        run: |
          {
            echo '### Laufzeiten full_corpus_smoke'
            echo
            echo '| Schritt | Wert |'
            echo '| --- | --- |'
            echo "| Seed | ${SEED_STATUS:-unbekannt} (Projektion ${SEED_BUILD:-0} s, Verifikation ${SEED_VERIFY:-0} s, Einsetzen ${SEED_INSTALL:-0} s) |"
            if [ -f "$RUNNER_TEMP/timings.txt" ]; then
              sed -E 's/^([^=]+)=(.*)$/| \1 | \2 s |/' "$RUNNER_TEMP/timings.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Laufzeiten: seed=${SEED_STATUS:-unbekannt}/${SEED_BUILD:-0}s $( [ -f "$RUNNER_TEMP/timings.txt" ] && paste -sd ',' "$RUNNER_TEMP/timings.txt" )"
