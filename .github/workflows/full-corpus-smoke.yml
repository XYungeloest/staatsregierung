name: OstRecht-Vollbestand-Smoke

# Browser- und Barrierefreiheits-Smoke gegen den gebauten OstRecht-Worker mit der
# vollständigen lokalen D1-Projektion (alle Normen). Pull Requests laufen gegen das
# repräsentative Fixture (data/recht/runtime-fixture.json); der Vollbestand wird hier
# manuell (workflow_dispatch), wöchentlich und als Release-Gate in deploy.yml geprüft.
# Es wird keine Cloudflare-Datenbank berührt.

on:
  workflow_dispatch:
  schedule:
    - cron: '30 3 * * 1'

concurrency:
  group: full-corpus-smoke
  cancel-in-progress: true

jobs:
  full_corpus_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: OstRecht bauen
        run: npm run build:recht
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Vollständige lokale D1-Projektion erzeugen
        run: npm run norms:runtime:d1-local
      - name: Lokale D1-Projektion verifizieren
        run: npm run norms:runtime:d1-verify -- --local --fts-integrity
      - name: Zentrale Seiten barrierefrei prüfen
        env:
          SITE_TARGETS: law
        run: npm run test:a11y:ci
      - name: Zentrale Nutzerwege in Chromium prüfen
        env:
          SITE_TARGETS: law
        run: npm run test:browsers:ci
