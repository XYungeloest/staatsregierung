name: Pull Request prüfen und Vorschau erzeugen

on:
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Playwright-Browser installieren
        run: npx playwright install --with-deps chromium firefox webkit
      - name: Inhalte und Wissenshub prüfen
        run: |
          npm run content:check
          npm run knowledge:build
          git diff --exit-code -- knowledge/generated
          npm run knowledge:check
      - name: TypeScript, Studio-Worker und Unit-Tests prüfen
        run: |
          npm run check
          npm run editorial:check
          npm run test:unit
      - name: Öffentliche Website bauen
        run: npm run build
        env:
          PORTAL_BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
      - name: Links und SEO prüfen
        run: |
          npm run test:links
          npm run test:seo
      - name: Accessibility prüfen
        run: npm run test:a11y
      - name: Layout- und Qualitätsprüfungen
        run: npm run test:quality
      - name: Browser-Smoke-Tests
        run: npm run test:browsers

  visual:
    runs-on: macos-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Chromium installieren
        run: npx playwright install chromium
      - name: Visuelle Regressionen prüfen
        run: npm run test:visual

  preview:
    if: ${{ vars.CLOUDFLARE_PREVIEWS_ENABLED == 'true' }}
    needs:
      - quality
      - visual
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v4
      - name: Node.js einrichten
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Vorschau bauen
        run: npm run build
        env:
          PORTAL_BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
      - name: Cloudflare-Worker-Version hochladen
        id: cloudflare_preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          OUTPUT="$(npx wrangler versions upload --config wrangler.jsonc --preview-alias "pr-${PR_NUMBER}")"
          PREVIEW_URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[^[:space:]]+' | tail -n 1 | sed 's/[),.]$//')"
          if [ -z "$PREVIEW_URL" ]; then
            printf '%s\n' "$OUTPUT" >&2
            exit 1
          fi
          printf 'preview_url=%s\n' "$PREVIEW_URL" >> "$GITHUB_OUTPUT"
      - name: Vorschau im Pull Request verlinken
        uses: actions/github-script@v7
        env:
          PREVIEW_URL: ${{ steps.cloudflare_preview.outputs.preview_url }}
        with:
          script: |
            const marker = '<!-- ostrecht-cloudflare-preview -->';
            const body = `${marker}\nGeschützte Cloudflare-Vorschau: ${process.env.PREVIEW_URL}\n\nDie Vorschau zeigt den Stand dieses Pull Requests. Der Zugriff muss durch die konfigurierte Cloudflare-Access-Anwendung freigegeben sein.`;
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }
