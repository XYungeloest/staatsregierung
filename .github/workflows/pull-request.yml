name: Pull Request prüfen und Vorschau erzeugen

# Pull Requests prüfen schnell gegen das repräsentative Testfixture (zwei parallele Jobs,
# Pflichtchecks des Rulesets: classify, quality, accessibility_smoke, browser_smoke). Berührt
# die Änderung Laufzeit, Projektion oder den Bestand in größerem Umfang, läuft zusätzlich der
# Vollbestand-Smoke mit dem gecachten D1-Seed (Job d1_seed parallel zu quality). Die kritische
# Screenshot-Suite (visual-critical) läuft nur bei Oberflächenänderungen und ist kein Pflichtcheck;
# die breite Inventur läuft auf main und wöchentlich (visual-extended.yml).

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      deploy_portal: ${{ steps.scope.outputs.deploy_portal }}
      deploy_law: ${{ steps.scope.outputs.deploy_law }}
      deploy_targets: ${{ steps.scope.outputs.deploy_targets }}
      check_portal: ${{ steps.scope.outputs.check_portal }}
      check_law: ${{ steps.scope.outputs.check_law }}
      build_targets: ${{ steps.scope.outputs.build_targets }}
      ui_targets: ${{ steps.scope.outputs.ui_targets }}
      run_content_check: ${{ steps.scope.outputs.run_content_check }}
      run_knowledge_check: ${{ steps.scope.outputs.run_knowledge_check }}
      run_unit_tests: ${{ steps.scope.outputs.run_unit_tests }}
      run_corpus_tests: ${{ steps.scope.outputs.run_corpus_tests }}
      run_ui_smoke: ${{ steps.scope.outputs.run_ui_smoke }}
      run_d1_sync: ${{ steps.scope.outputs.run_d1_sync }}
      run_full_corpus_smoke: ${{ steps.scope.outputs.run_full_corpus_smoke }}
      run_visual: ${{ steps.scope.outputs.run_visual }}
      playwright_version: ${{ steps.scope.outputs.playwright_version }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Node.js und Abhängigkeiten (Code-Abschluss der Projektion braucht esbuild)
        uses: ./.github/actions/setup-node-modules
      - name: Änderungsscope bestimmen
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          CHANGED_PATHS="${RUNNER_TEMP}/changed-paths.txt"
          git diff --name-only "$BASE_SHA...$HEAD_SHA" > "$CHANGED_PATHS"
          node scripts/classify-change-scope.mjs --stdin --github-output "$GITHUB_OUTPUT" < "$CHANGED_PATHS"
          echo "playwright_version=$(node -e 'console.log(require("./package-lock.json").packages["node_modules/@playwright/test"].version)')" >> "$GITHUB_OUTPUT"

          output_value() {
            grep "^$1=" "$GITHUB_OUTPUT" | tail -n 1 | cut -d '=' -f 2-
          }
          target_label() {
            case "$1" in
              portal) printf 'Staatsportal' ;;
              law) printf 'OstRecht' ;;
              portal,law) printf 'Staatsportal und OstRecht' ;;
              '') printf 'kein Ziel' ;;
            esac
          }
          deployment_label() {
            if [ -n "$1" ]; then target_label "$1"; else printf 'kein Produktionsdeployment'; fi
          }
          yes_no() {
            if [ "$1" = "true" ]; then printf 'ja'; else printf 'nein'; fi
          }

          {
            echo '## Änderungswirkung'
            echo
            echo "- Geänderte Dateien: $(grep -cve '^[[:space:]]*$' "$CHANGED_PATHS" || true)"
            echo "- Deployment: $(deployment_label "$(output_value deploy_targets)")"
            echo "- Astro-Build: $(target_label "$(output_value build_targets)")"
            echo "- Portal-Prüfung: $(yes_no "$(output_value check_portal)")"
            echo "- OstRecht-Prüfung: $(yes_no "$(output_value check_law)")"
            echo "- Content-Prüfung: $(yes_no "$(output_value run_content_check)")"
            echo "- Unit-Tests (schnell): $(yes_no "$(output_value run_unit_tests)")"
            echo "- Korpus-Tests: $(yes_no "$(output_value run_corpus_tests)")"
            echo "- UI-Smoke (Fixture): $(target_label "$(output_value ui_targets)")"
            echo "- Vollbestand-Smoke zusätzlich: $(yes_no "$(output_value run_full_corpus_smoke)")"
            echo "- Screenshot-Suite (kritisch): $(yes_no "$(output_value run_visual)")"
          } >> "$GITHUB_STEP_SUMMARY"

  d1_token_check:
    # Berührt der PR die D1-Projektion, wird der API-Transport des Syncs mit dem Repository-
    # Secret geprüft: lesend gegen die produktive Datenbank (nur Fingerabdruck, --remote-state) und
    # schreibend gegen ostrecht-recht-staging (Verkündungen des Testfixtures, idempotent). Die
    # produktive Datenbank wird nie beschrieben; Forks erhalten keine Secrets und überspringen.
    # Der Remote-State-Check (Sekunden, kein Sync-Plan) sagt vorher, wie der automatische Sync
    # auf main nach dem Merge entscheiden würde: No-op oder inkrementell sind grün. Verlangt er
    # eine Vollprojektion nur wegen geänderter Projektionslogik (Exit 3), rechnet der
    # Äquivalenznachweis (scripts/d1-projection-snapshot.mjs prove): Basis- und Zielprojektion
    # (Seed-Cache oder lokale Projektion) werden vollständig verglichen; ein nachgewiesener
    # inkrementeller Umfang ist grün, andernfalls bleibt der Check rot (docs/DEPLOYMENT_RUNBOOK.md,
    # D1-Release-Gate).
    needs:
      - classify
      - d1_seed
    if: ${{ always() && needs.classify.outputs.run_d1_sync == 'true' && github.event.pull_request.head.repo.full_name == github.repository && (needs.d1_seed.result == 'success' || needs.d1_seed.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Node.js und Abhängigkeiten
        uses: ./.github/actions/setup-node-modules
      - name: Produktive D1 lesen (Remote-State, kein Schreibzugriff, kein Sync-Plan)
        id: remote_state
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          START=$(date +%s)
          set +e
          npm run norms:runtime:d1-sync -- --transport api --remote-state --git-diff "$BASE_SHA" "$HEAD_SHA" --budget incremental
          RC=$?
          set -e
          echo "rc=$RC" >> "$GITHUB_OUTPUT"
          echo "Remote-State-Check: $(( $(date +%s) - START )) s (Exit $RC)" >> "$GITHUB_STEP_SUMMARY"
          if [ "$RC" != "0" ] && [ "$RC" != "3" ]; then exit "$RC"; fi
      - name: Seed-Schlüssel der Basis bestimmen (Äquivalenznachweis)
        if: ${{ steps.remote_state.outputs.rc == '3' }}
        id: base_seed
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          node --experimental-strip-types scripts/d1-runtime-seed.mjs fingerprint --json --ref "$BASE_SHA" > "$RUNNER_TEMP/base-seed.json"
          node -e '
            const seed = JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"));
            const legacy = seed.legacyFingerprint ? seed.snapshot.replace(seed.fingerprint.slice(0, 32), seed.legacyFingerprint.slice(0, 32)) : "";
            const lines = [`key=d1-seed-${seed.fingerprint}`, `snapshot=${seed.snapshot}`, `legacy_key=${seed.legacyFingerprint ? `d1-seed-${seed.legacyFingerprint}` : ""}`, `legacy_snapshot=${legacy}`];
            require("fs").appendFileSync(process.env.GITHUB_OUTPUT, `${lines.join("\n")}\n`);
          ' "$RUNNER_TEMP/base-seed.json"
      - name: Basis-Seed aus dem Cache (neue Identität)
        if: ${{ steps.remote_state.outputs.rc == '3' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.base_seed.outputs.snapshot }}
            ${{ steps.base_seed.outputs.snapshot }}.json
          key: ${{ steps.base_seed.outputs.key }}
      - name: Basis-Seed aus dem Cache (frühere Identität, Übergang)
        if: ${{ steps.remote_state.outputs.rc == '3' && steps.base_seed.outputs.legacy_key != '' }}
        uses: actions/cache/restore@v6
        with:
          path: |
            ${{ steps.base_seed.outputs.legacy_snapshot }}
            ${{ steps.base_seed.outputs.legacy_snapshot }}.json
          key: ${{ steps.base_seed.outputs.legacy_key }}
      - name: Ziel-Seed bereitstellen (Cache oder einmalige Projektion)
        if: ${{ steps.remote_state.outputs.rc == '3' }}
        uses: ./.github/actions/d1-seed
        with:
          cache: 'true'
      - name: Äquivalenznachweis rechnen (Basis- gegen Zielprojektion, vollständiger Tabellenvergleich)
        if: ${{ steps.remote_state.outputs.rc == '3' }}
        id: proof
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          START=$(date +%s)
          npm run norms:runtime:d1-prove -- --base "$BASE_SHA" --head "$HEAD_SHA" --out "$RUNNER_TEMP/d1-equivalence" || true
          PROOF="$(ls "$RUNNER_TEMP"/d1-equivalence/proof-*.json | head -n 1)"
          echo "path=$PROOF" >> "$GITHUB_OUTPUT"
          {
            echo '### Äquivalenznachweis'
            echo
            echo "- Ergebnis: $(node -e 'const p=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8")); console.log(`${p.result}${p.logicChange ? ` (${p.logicChange})` : ""}; abweichende Tabellen: ${(p.comparison && p.comparison.differingTables || []).join(", ") || "keine"}`)' "$PROOF")"
            echo "- Dauer: $(( $(date +%s) - START )) s"
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Remote-State mit Nachweis (so entscheidet d1_sync auf main)
        if: ${{ steps.remote_state.outputs.rc == '3' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          PROOF: ${{ steps.proof.outputs.path }}
        run: npm run norms:runtime:d1-sync -- --transport api --remote-state --git-diff "$BASE_SHA" "$HEAD_SHA" --budget incremental --equivalence-proof "$PROOF"
      - name: Staging-D1 schreiben (Verkündungstabelle, Teilsync ohne Identitätsänderung)
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          OSTRECHT_D1_DATABASE_ID: ba9c0e0b-ba18-4aec-b28e-fe65c8b69674
        # Staging trägt den Vollbestand (Scope full). Der Teilsync schreibt nur law_publications
        # und last_sync_at; die gespeicherte Identität bleibt unverändert (Base-State-Guard
        # verlangt eine vollständige Identität im selben Scope).
        run: npm run norms:runtime:d1-sync -- --transport api --publications --budget incremental --max-rows-read 5000 --max-rows-written 5000

  docs_check:
    needs: classify
    if: ${{ needs.classify.outputs.scope == 'docs-only' }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
      - name: Dokumentationsänderung auf Whitespace- und Patchfehler prüfen
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --check "$BASE_SHA...$HEAD_SHA"
      - name: Dokumentationsstruktur prüfen (kanonische Dokumente, Links, TODO)
        run: node scripts/check-docs.mjs

  quality:
    needs: classify
    if: ${{ needs.classify.outputs.scope != 'docs-only' }}
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Node.js und Abhängigkeiten
        uses: ./.github/actions/setup-node-modules
      - name: Abhängigkeiten auf hohe Sicherheitsrisiken prüfen (Registryfehler werden wiederholt, Befunde nicht)
        run: |
          START=$(date +%s)
          node scripts/npm-audit-retry.mjs --audit-level high
          echo "audit=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/timings.txt"
      - name: Dokumentationsstruktur, Inhalte und Wissenshub prüfen
        env:
          RUN_CONTENT_CHECK: ${{ needs.classify.outputs.run_content_check }}
          RUN_KNOWLEDGE_CHECK: ${{ needs.classify.outputs.run_knowledge_check }}
        run: |
          START=$(date +%s)
          node scripts/check-docs.mjs
          if [ "$RUN_CONTENT_CHECK" = "true" ]; then
            npm run content:check
          fi
          if [ "$RUN_KNOWLEDGE_CHECK" = "true" ]; then
            npm run knowledge:build
            git diff --exit-code -- knowledge/generated
            npm run knowledge:check
          fi
          echo "content=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/timings.txt"
      - name: TypeScript und Unit-Tests prüfen (schnelle Tests immer, Korpus-Tests nur bei Projektions-, Laufzeit- oder Schemaänderung)
        env:
          CHECK_PORTAL: ${{ needs.classify.outputs.check_portal }}
          CHECK_LAW: ${{ needs.classify.outputs.check_law }}
          RUN_UNIT_TESTS: ${{ needs.classify.outputs.run_unit_tests }}
          RUN_CORPUS_TESTS: ${{ needs.classify.outputs.run_corpus_tests }}
        run: |
          START=$(date +%s)
          if [ "$CHECK_PORTAL" = "true" ]; then
            npm run check:portal
          fi
          if [ "$CHECK_LAW" = "true" ]; then
            npm run check:recht
          fi
          if [ "$RUN_UNIT_TESTS" = "true" ]; then
            npm run test:fast
          fi
          if [ "$RUN_CORPUS_TESTS" = "true" ]; then
            npm run test:corpus
          fi
          echo "types_unit=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/timings.txt"
      - name: Öffentliche Website bauen
        if: ${{ needs.classify.outputs.build_targets != '' }}
        env:
          BUILD_TARGETS: ${{ needs.classify.outputs.build_targets }}
          PORTAL_BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
        run: |
          START=$(date +%s)
          case "$BUILD_TARGETS" in
            portal,law) npm run build ;;
            portal) npm run build:portal ;;
            law) npm run build:recht ;;
            *)
              echo "Unbekannte Build-Ziele: $BUILD_TARGETS" >&2
              exit 1
              ;;
          esac
          DEPLOY_TARGETS="$BUILD_TARGETS" npm run deploy:assets:check
          echo "build=$(( $(date +%s) - START ))" >> "$RUNNER_TEMP/timings.txt"
      - name: Links und SEO prüfen
        if: ${{ needs.classify.outputs.build_targets != '' }}
        env:
          SITE_TARGETS: ${{ needs.classify.outputs.build_targets }}
        run: |
          npm run test:links:run
          npm run test:seo:run
      - name: Geprüften PR-Build bereitstellen
        if: ${{ needs.classify.outputs.build_targets != '' }}
        uses: actions/upload-artifact@v7
        with:
          name: pr-site-build-${{ github.event.pull_request.head.sha }}
          path: apps/*/dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1
      - name: Laufzeiten festhalten
        if: ${{ always() }}
        run: |
          {
            echo '### Laufzeiten quality'
            echo
            echo '| Schritt | Sekunden |'
            echo '| --- | --- |'
            if [ -f "$RUNNER_TEMP/timings.txt" ]; then
              sed -E 's/^([^=]+)=(.*)$/| \1 | \2 |/' "$RUNNER_TEMP/timings.txt"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [ -f "$RUNNER_TEMP/timings.txt" ] && echo "Laufzeiten: $(paste -sd ',' "$RUNNER_TEMP/timings.txt")" || true

  accessibility_smoke:
    if: ${{ needs.classify.outputs.run_ui_smoke == 'true' }}
    needs:
      - classify
      - quality
    runs-on: ubuntu-latest
    env:
      # Pull Requests testen gegen das repräsentative D1-Fixture (siehe scripts/serve-law-worker.mjs).
      OSTRECHT_D1_FIXTURE: data/recht/runtime-fixture.json
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Node.js und Abhängigkeiten
        uses: ./.github/actions/setup-node-modules
      - uses: actions/download-artifact@v8
        with:
          name: pr-site-build-${{ github.event.pull_request.head.sha }}
          path: apps
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: OstRecht-Worker mit lokaler D1-Projektion (Testfixture) vorbereiten
        if: ${{ contains(needs.classify.outputs.ui_targets, 'law') }}
        uses: ./.github/actions/d1-seed
        with:
          fixture: data/recht/runtime-fixture.json
          cache: 'false'
      - name: Zentrale Seiten barrierefrei prüfen
        env:
          SITE_TARGETS: ${{ needs.classify.outputs.ui_targets }}
        run: npm run test:a11y:ci

  browser_smoke:
    if: ${{ needs.classify.outputs.run_ui_smoke == 'true' }}
    needs:
      - classify
      - quality
    runs-on: ubuntu-latest
    env:
      # Pull Requests testen gegen das repräsentative D1-Fixture (siehe scripts/serve-law-worker.mjs).
      OSTRECHT_D1_FIXTURE: data/recht/runtime-fixture.json
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Node.js und Abhängigkeiten
        uses: ./.github/actions/setup-node-modules
      - uses: actions/download-artifact@v8
        with:
          name: pr-site-build-${{ github.event.pull_request.head.sha }}
          path: apps
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: OstRecht-Worker mit lokaler D1-Projektion (Testfixture) vorbereiten
        if: ${{ contains(needs.classify.outputs.ui_targets, 'law') }}
        uses: ./.github/actions/d1-seed
        with:
          fixture: data/recht/runtime-fixture.json
          cache: 'false'
      - name: Zentrale Nutzerwege in Chromium prüfen
        env:
          SITE_TARGETS: ${{ needs.classify.outputs.ui_targets }}
        run: npm run test:browsers:ci

  # Vollbestand-Seed parallel zu quality, nur bei Laufzeit-/Projektions-/Bestandsänderungen:
  # Cache-Treffer → Verifikation, Cache-Miss → genau eine Projektion und neuer Cache-Eintrag.
  d1_seed:
    needs: classify
    if: ${{ needs.classify.outputs.scope != 'docs-only' && needs.classify.outputs.run_full_corpus_smoke == 'true' && contains(needs.classify.outputs.ui_targets, 'law') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    outputs:
      status: ${{ steps.seed.outputs.status }}
      fingerprint: ${{ steps.seed.outputs.fingerprint }}
    steps:
      - uses: actions/checkout@v7
      - name: Node.js und Abhängigkeiten
        uses: ./.github/actions/setup-node-modules
      - name: Vollbestand-Seed bereitstellen (Cache oder einmalige Projektion)
        id: seed
        uses: ./.github/actions/d1-seed
        with:
          cache: 'true'

  # Vollbestand-Smoke des Pull Requests (kein Pflichtcheck): Verifikation, A11y und Browser gegen
  # den gebauten Worker mit dem gecachten Seed. Läuft nur, wenn die Änderung ihn verlangt.
  full_corpus_smoke:
    needs:
      - classify
      - quality
      - d1_seed
    if: ${{ needs.classify.outputs.run_full_corpus_smoke == 'true' && contains(needs.classify.outputs.ui_targets, 'law') && needs.quality.result == 'success' && needs.d1_seed.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
      - name: Node.js und Abhängigkeiten
        uses: ./.github/actions/setup-node-modules
      - uses: actions/download-artifact@v8
        with:
          name: pr-site-build-${{ github.event.pull_request.head.sha }}
          path: apps
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: OstRecht-Worker mit dem Vollbestand vorbereiten (Seed aus dem Cache)
        id: seed
        uses: ./.github/actions/d1-seed
        with:
          cache: 'true'
      - name: Vollbestand gegen den Git-Bestand verifizieren
        run: npm run norms:runtime:d1-verify -- --local --fts-integrity
      - name: Zentrale Seiten barrierefrei prüfen (Vollbestand)
        env:
          SITE_TARGETS: law
        run: npm run test:a11y:ci
      - name: Zentrale Nutzerwege in Chromium prüfen (Vollbestand)
        env:
          SITE_TARGETS: law
        run: npm run test:browsers:ci
      - name: Seed-Status festhalten
        if: ${{ always() }}
        env:
          SEED_STATUS: ${{ steps.seed.outputs.status }}
          SEED_BUILD: ${{ steps.seed.outputs.build-seconds }}
        run: |
          echo "Vollbestand-Seed: ${SEED_STATUS:-unbekannt} (Projektion ${SEED_BUILD:-0} s)"

  # Kritische Screenshot-Suite (visual-critical) bei Oberflächenänderungen im festen Playwright-
  # Container, strikt gegen die committeten Linux-Baselines (Fixture-Bestand). Kein Pflichtcheck
  # des Rulesets; Baselines entstehen nur bewusst (npm run test:visual:update:linux oder Workflow
  # „Screenshot-Baselines erneuern“), nie in dieser CI.
  visual:
    needs:
      - classify
      - quality
    if: ${{ needs.classify.outputs.run_visual == 'true' && needs.classify.outputs.build_targets != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.classify.outputs.playwright_version }}-noble
    env:
      OSTRECHT_D1_FIXTURE: data/recht/runtime-fixture.json
      HOME: /root
    steps:
      - name: Git im Container sicherstellen (Seed-Fingerabdruck liest Git-Blob-Kennungen)
        run: command -v git >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends git)
      - uses: actions/checkout@v7
      - name: Arbeitsbaum für Git im Container freigeben (Checkout gehört einem anderen Benutzer)
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Abhängigkeiten (Node.js des Containers)
        uses: ./.github/actions/setup-node-modules
        with:
          node-version: ''
      - uses: actions/download-artifact@v8
        with:
          name: pr-site-build-${{ github.event.pull_request.head.sha }}
          path: apps
      - name: OstRecht-Worker mit dem Testfixture vorbereiten
        if: ${{ contains(needs.classify.outputs.build_targets, 'law') }}
        uses: ./.github/actions/d1-seed
        with:
          fixture: data/recht/runtime-fixture.json
          cache: 'false'
      - name: Kritische Screenshot-Suite strikt gegen die committeten Linux-Baselines prüfen
        env:
          SITE_TARGETS: ${{ needs.classify.outputs.build_targets }}
        run: |
          # Kein Bootstrap: fehlende Baselines sind ein Fehler. Neue oder geänderte Linux-Baselines
          # entstehen nur bewusst (npm run test:visual:update:linux mit Docker oder Workflow
          # „Screenshot-Baselines erneuern“ mit Apply-Befehl), nach Sichtprüfung und Commit.
          if ! ls tests/visual.spec.ts-snapshots/*-linux.png >/dev/null 2>&1; then
            echo "::error::Keine Linux-Screenshot-Baselines im Repository (tests/visual.spec.ts-snapshots/*-linux.png). Baselines mit npm run test:visual:update:linux oder dem Workflow „Screenshot-Baselines erneuern“ erzeugen, sichten und committen."
            exit 1
          fi
          npm run test:visual:critical
      - name: Testbericht bereitstellen
        if: ${{ failure() }}
        uses: actions/upload-artifact@v7
        with:
          name: visual-report-${{ github.event.pull_request.head.sha }}
          path: |
            playwright-report
            test-results
          retention-days: 14

  preview:
    if: ${{ always() && github.actor != 'dependabot[bot]' && vars.CLOUDFLARE_PREVIEWS_ENABLED == 'true' && needs.classify.outputs.deploy_portal == 'true' && needs.quality.result == 'success' && (needs.accessibility_smoke.result == 'success' || needs.accessibility_smoke.result == 'skipped') && (needs.browser_smoke.result == 'success' || needs.browser_smoke.result == 'skipped') }}
    needs:
      - classify
      - quality
      - accessibility_smoke
      - browser_smoke
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7
      - name: Node.js und Abhängigkeiten
        uses: ./.github/actions/setup-node-modules
      - name: Geprüften PR-Build laden
        uses: actions/download-artifact@v8
        with:
          name: pr-site-build-${{ github.event.pull_request.head.sha }}
          path: apps
      - name: Cloudflare-Worker-Version hochladen
        id: cloudflare_preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          OUTPUT="$(npx wrangler versions upload --config apps/portal/wrangler.jsonc --env="" --preview-alias "pr-${PR_NUMBER}")"
          PREVIEW_URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[^[:space:]]+' | tail -n 1 | sed 's/[),.]$//')"
          if [ -z "$PREVIEW_URL" ]; then
            printf '%s\n' "$OUTPUT" >&2
            exit 1
          fi
          VERSION_ID="$(printf '%s\n' "$OUTPUT" | sed -nE 's/.*Worker Version ID:[[:space:]]*([0-9a-fA-F-]{36}).*/\1/p' | tail -n 1)"
          if [ -z "$VERSION_ID" ]; then
            printf '%s\n' "$OUTPUT" >&2
            exit 1
          fi
          printf 'preview_url=%s\n' "$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          printf 'version_id=%s\n' "$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: Vorschau erreichbar prüfen
        env:
          PREVIEW_URL: ${{ steps.cloudflare_preview.outputs.preview_url }}
        run: |
          HTTP_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$PREVIEW_URL")"
          case "$HTTP_STATUS" in
            2??|3??)
              ;;
            *)
              printf 'Die Vorschau %s antwortet mit HTTP %s.\n' "$PREVIEW_URL" "$HTTP_STATUS" >&2
              exit 1
              ;;
          esac
      - name: Vorschau im Pull Request verlinken
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.cloudflare_preview.outputs.preview_url }}
          VERSION_ID: ${{ steps.cloudflare_preview.outputs.version_id }}
        with:
          script: |
            const marker = '<!-- ostrecht-cloudflare-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            const previousVersionIds = existing?.body
              ?.match(/<!-- cloudflare-versions:([0-9a-fA-F,-]+) -->/)?.[1]
              ?.split(',') ?? [];
            const versionIds = [...new Set([...previousVersionIds, process.env.VERSION_ID])];
            const versionMarker = `<!-- cloudflare-versions:${versionIds.join(',')} -->`;
            const body = `${marker}\n${versionMarker}\nGeschützte Cloudflare-Vorschau: ${process.env.PREVIEW_URL}\n\nDie Vorschau zeigt den Stand dieses Pull Requests. Der Zugriff muss durch die konfigurierte Cloudflare-Access-Anwendung freigegeben sein.`;
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  cleanup-preview:
    if: ${{ github.event.action == 'closed' && vars.CLOUDFLARE_PREVIEWS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Preview-Version ermitteln
        id: preview
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- ostrecht-cloudflare-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const comment = comments.find((entry) => entry.user?.type === 'Bot' && entry.body?.includes(marker));
            const versionIds = comment?.body
              ?.match(/<!-- cloudflare-versions:([0-9a-fA-F,-]+) -->/)?.[1]
              ?.split(',')
              .filter((versionId) => /^[0-9a-fA-F-]{36}$/.test(versionId)) ?? [];
            if (!comment || versionIds.length === 0) {
              core.notice('Keine durch diesen Workflow verwaltete Preview-Version gefunden.');
              core.setOutput('found', 'false');
              return;
            }
            core.setOutput('found', 'true');
            core.setOutput('version_ids', versionIds.join(' '));
            core.setOutput('comment_id', String(comment.id));
      - name: Cloudflare-Preview löschen
        if: ${{ steps.preview.outputs.found == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_IDS: ${{ steps.preview.outputs.version_ids }}
        run: |
          for version_id in ${VERSION_IDS}; do
            curl --fail-with-body --silent --show-error \
              --request DELETE \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/workers/ostrecht-portal/versions/${version_id}"
          done
      - name: Preview-Kommentar aktualisieren
        if: ${{ steps.preview.outputs.found == 'true' }}
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ steps.preview.outputs.comment_id }}
        with:
          script: |
            const marker = '<!-- ostrecht-cloudflare-preview -->';
            const body = `${marker}\nCloudflare-Vorschau nach dem Schließen des Pull Requests entfernt.`;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.COMMENT_ID),
              body,
            });
