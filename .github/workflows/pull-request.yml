name: Pull Request prüfen und Vorschau erzeugen

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - closed

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pull-request-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  classify:
    if: ${{ github.event.action != 'closed' }}
    runs-on: ubuntu-latest
    outputs:
      scope: ${{ steps.scope.outputs.scope }}
      run_ui_smoke: ${{ steps.scope.outputs.run_ui_smoke }}
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Änderungsscope bestimmen
        id: scope
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: git diff --name-only "$BASE_SHA...$HEAD_SHA" | node scripts/classify-change-scope.mjs --stdin --github-output "$GITHUB_OUTPUT"

  quality:
    needs: classify
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Abhängigkeiten auf hohe Sicherheitsrisiken prüfen
        run: npm audit --audit-level=high
      - name: Inhalte und Wissenshub prüfen
        run: |
          npm run content:check
          npm run knowledge:build
          git diff --exit-code -- knowledge/generated
          npm run knowledge:check
      - name: TypeScript und Unit-Tests prüfen
        run: |
          npm run check
          npm run test:unit
      - name: Studio-Worker prüfen
        if: ${{ needs.classify.outputs.run_ui_smoke == 'true' }}
        run: npm run editorial:check
      - name: Öffentliche Website bauen
        run: npm run build
        env:
          PORTAL_BUILD_COMMIT: ${{ github.event.pull_request.head.sha }}
      - name: Links und SEO prüfen
        run: |
          npm run test:links:run
          npm run test:seo:run
      - name: Geprüften PR-Build bereitstellen
        uses: actions/upload-artifact@v7
        with:
          name: pr-site-build-${{ github.event.pull_request.head.sha }}
          path: dist/
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 1

  accessibility_smoke:
    if: ${{ needs.classify.outputs.run_ui_smoke == 'true' }}
    needs:
      - classify
      - quality
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: pr-site-build-${{ github.event.pull_request.head.sha }}
          path: dist
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Zentrale Seiten barrierefrei prüfen
        run: npm run test:a11y:ci

  browser_smoke:
    if: ${{ needs.classify.outputs.run_ui_smoke == 'true' }}
    needs:
      - classify
      - quality
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - uses: actions/download-artifact@v8
        with:
          name: pr-site-build-${{ github.event.pull_request.head.sha }}
          path: dist
      - name: Chromium installieren
        run: npx playwright install --with-deps chromium
      - name: Zentrale Nutzerwege in Chromium prüfen
        run: npm run test:browsers:ci

  preview:
    if: ${{ always() && vars.CLOUDFLARE_PREVIEWS_ENABLED == 'true' && needs.quality.result == 'success' && (needs.accessibility_smoke.result == 'success' || needs.accessibility_smoke.result == 'skipped') && (needs.browser_smoke.result == 'success' || needs.browser_smoke.result == 'skipped') }}
    needs:
      - quality
      - accessibility_smoke
      - browser_smoke
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v6
      - name: Node.js einrichten
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Geprüften PR-Build laden
        uses: actions/download-artifact@v8
        with:
          name: pr-site-build-${{ github.event.pull_request.head.sha }}
          path: dist
      - name: Cloudflare-Worker-Version hochladen
        id: cloudflare_preview
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          OUTPUT="$(npx wrangler versions upload --config wrangler.jsonc --env="" --preview-alias "pr-${PR_NUMBER}")"
          PREVIEW_URL="$(printf '%s\n' "$OUTPUT" | grep -Eo 'https://[^[:space:]]+' | tail -n 1 | sed 's/[),.]$//')"
          if [ -z "$PREVIEW_URL" ]; then
            printf '%s\n' "$OUTPUT" >&2
            exit 1
          fi
          VERSION_ID="$(printf '%s\n' "$OUTPUT" | sed -nE 's/.*Worker Version ID:[[:space:]]*([0-9a-fA-F-]{36}).*/\1/p' | tail -n 1)"
          if [ -z "$VERSION_ID" ]; then
            printf '%s\n' "$OUTPUT" >&2
            exit 1
          fi
          printf 'preview_url=%s\n' "$PREVIEW_URL" >> "$GITHUB_OUTPUT"
          printf 'version_id=%s\n' "$VERSION_ID" >> "$GITHUB_OUTPUT"
      - name: Vorschau erreichbar prüfen
        env:
          PREVIEW_URL: ${{ steps.cloudflare_preview.outputs.preview_url }}
        run: |
          HTTP_STATUS="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' "$PREVIEW_URL")"
          case "$HTTP_STATUS" in
            2??|3??)
              ;;
            *)
              printf 'Die Vorschau %s antwortet mit HTTP %s.\n' "$PREVIEW_URL" "$HTTP_STATUS" >&2
              exit 1
              ;;
          esac
      - name: Vorschau im Pull Request verlinken
        uses: actions/github-script@v9
        env:
          PREVIEW_URL: ${{ steps.cloudflare_preview.outputs.preview_url }}
          VERSION_ID: ${{ steps.cloudflare_preview.outputs.version_id }}
        with:
          script: |
            const marker = '<!-- ostrecht-cloudflare-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find((comment) => comment.user?.type === 'Bot' && comment.body?.includes(marker));
            const previousVersionIds = existing?.body
              ?.match(/<!-- cloudflare-versions:([0-9a-fA-F,-]+) -->/)?.[1]
              ?.split(',') ?? [];
            const versionIds = [...new Set([...previousVersionIds, process.env.VERSION_ID])];
            const versionMarker = `<!-- cloudflare-versions:${versionIds.join(',')} -->`;
            const body = `${marker}\n${versionMarker}\nGeschützte Cloudflare-Vorschau: ${process.env.PREVIEW_URL}\n\nDie Vorschau zeigt den Stand dieses Pull Requests. Der Zugriff muss durch die konfigurierte Cloudflare-Access-Anwendung freigegeben sein.`;
            if (existing) {
              await github.rest.issues.updateComment({ owner: context.repo.owner, repo: context.repo.repo, comment_id: existing.id, body });
            } else {
              await github.rest.issues.createComment({ owner: context.repo.owner, repo: context.repo.repo, issue_number: context.issue.number, body });
            }

  cleanup-preview:
    if: ${{ github.event.action == 'closed' && vars.CLOUDFLARE_PREVIEWS_ENABLED == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - name: Preview-Version ermitteln
        id: preview
        uses: actions/github-script@v9
        with:
          script: |
            const marker = '<!-- ostrecht-cloudflare-preview -->';
            const comments = await github.paginate(github.rest.issues.listComments, {
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const comment = comments.find((entry) => entry.user?.type === 'Bot' && entry.body?.includes(marker));
            const versionIds = comment?.body
              ?.match(/<!-- cloudflare-versions:([0-9a-fA-F,-]+) -->/)?.[1]
              ?.split(',')
              .filter((versionId) => /^[0-9a-fA-F-]{36}$/.test(versionId)) ?? [];
            if (!comment || versionIds.length === 0) {
              core.notice('Keine durch diesen Workflow verwaltete Preview-Version gefunden.');
              core.setOutput('found', 'false');
              return;
            }
            core.setOutput('found', 'true');
            core.setOutput('version_ids', versionIds.join(' '));
            core.setOutput('comment_id', String(comment.id));
      - name: Cloudflare-Preview löschen
        if: ${{ steps.preview.outputs.found == 'true' }}
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          VERSION_IDS: ${{ steps.preview.outputs.version_ids }}
        run: |
          for version_id in ${VERSION_IDS}; do
            curl --fail-with-body --silent --show-error \
              --request DELETE \
              --header "Authorization: Bearer ${CLOUDFLARE_API_TOKEN}" \
              "https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/workers/workers/ostrecht-portal/versions/${version_id}"
          done
      - name: Preview-Kommentar aktualisieren
        if: ${{ steps.preview.outputs.found == 'true' }}
        uses: actions/github-script@v9
        env:
          COMMENT_ID: ${{ steps.preview.outputs.comment_id }}
        with:
          script: |
            const marker = '<!-- ostrecht-cloudflare-preview -->';
            const body = `${marker}\nCloudflare-Vorschau nach dem Schließen des Pull Requests entfernt.`;
            await github.rest.issues.updateComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              comment_id: Number(process.env.COMMENT_ID),
              body,
            });
