name: Screenshot-Baselines erneuern

# Erzeugt die Linux-Baselines der Screenshot-Suite (tests/visual.spec.ts-snapshots/*-linux.png) im
# festen Playwright-Container gegen das Testfixture – nur auf Anforderung, gezielt für eine Website,
# eine Suite (kritisch oder breit) oder einzelne Tests (--grep). Direkt danach läuft dieselbe
# Auswahl strikt gegen die neuen Baselines. Die Baselines werden als Artefakt bereitgestellt;
# `npm run test:visual:baselines:apply -- --run <Lauf-ID>` übernimmt sie lokal, dann Sichtprüfung
# und Commit. Mit Docker geht es ohne diesen Workflow: `npm run test:visual:update:linux`. Die
# Jobs `visual` in Pull Requests und auf main vergleichen strikt und erzeugen nie selbst Baselines.

on:
  workflow_dispatch:
    inputs:
      site_targets:
        description: Websites, deren Baselines erneuert werden (portal, law oder portal,law)
        required: true
        default: portal,law
        type: string
      suite:
        description: Suite (critical = kritische Auswahl der Pull Requests, extended = breite Inventur)
        required: true
        default: extended
        type: choice
        options:
          - critical
          - extended
      grep:
        description: 'Nur Tests, deren Titel zu diesem Muster passt (optional, z. B. "Komponenten-Basislinien")'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  lockfile:
    runs-on: ubuntu-latest
    outputs:
      playwright_version: ${{ steps.version.outputs.playwright_version }}
    steps:
      - uses: actions/checkout@v7
      - name: Playwright-Version aus package-lock.json lesen (Container muss ihr entsprechen)
        id: version
        run: echo "playwright_version=$(node -e 'console.log(require("./package-lock.json").packages["node_modules/@playwright/test"].version)')" >> "$GITHUB_OUTPUT"

  baselines:
    needs: lockfile
    runs-on: ubuntu-latest
    timeout-minutes: 60
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.lockfile.outputs.playwright_version }}-noble
    env:
      OSTRECHT_D1_FIXTURE: data/recht/runtime-fixture.json
      HOME: /root
    steps:
      - name: Git im Container sicherstellen
        run: command -v git >/dev/null 2>&1 || (apt-get update && apt-get install -y --no-install-recommends git)
      - uses: actions/checkout@v7
      - name: Arbeitsbaum für Git im Container freigeben
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - name: Abhängigkeiten (Node.js des Containers)
        uses: ./.github/actions/setup-node-modules
        with:
          node-version: ''
      - name: Websites bauen
        env:
          PORTAL_BUILD_COMMIT: ${{ github.sha }}
        run: npm run build
      - name: OstRecht-Worker mit dem Testfixture vorbereiten
        uses: ./.github/actions/d1-seed
        with:
          fixture: data/recht/runtime-fixture.json
          cache: 'false'
      - name: Baselines erzeugen und dieselbe Auswahl strikt gegen die neuen Baselines prüfen
        env:
          SITE_TARGETS: ${{ github.event.inputs.site_targets }}
          SUITE: ${{ github.event.inputs.suite }}
          GREP: ${{ github.event.inputs.grep }}
        run: |
          if [ "$SUITE" = "critical" ]; then SCRIPT=test:visual:critical; else SCRIPT=test:visual:extended; fi
          if [ -n "$GREP" ]; then
            npm run "$SCRIPT" -- --update-snapshots --grep "$GREP"
            npm run "$SCRIPT" -- --grep "$GREP"
          else
            npm run "$SCRIPT" -- --update-snapshots
            npm run "$SCRIPT"
          fi
          echo "Geänderte Baselines: $(git status --porcelain -- tests/visual.spec.ts-snapshots | wc -l)" >> "$GITHUB_STEP_SUMMARY"
          git status --porcelain -- tests/visual.spec.ts-snapshots >> "$GITHUB_STEP_SUMMARY"
      - name: Baselines bereitstellen (npm run test:visual:baselines:apply -- --run <Lauf-ID>, sichten, committen)
        uses: actions/upload-artifact@v7
        with:
          name: visual-baselines-linux-${{ github.sha }}
          path: tests/visual.spec.ts-snapshots/*-linux.png
          retention-days: 14
          if-no-files-found: error
